  <main id="main">

    <section class="section section--tight" aria-label="Project index">
      <div class="container">
        <div id="work-listing">
          <noscript>
            <div class="list-flow">
              <article class="post-card">
                <h2 class="post-title"><a href="weaver/">Weaver</a></h2>
                <p class="post-dek">A privacy-first novel-writing studio that runs entirely in the browser. Native ES modules, Supabase, Deno, Postgres, Cloudflare Pages. Live.</p>
                <p class="card-links"><a href="https://legendalive.github.io/Weaver/" target="_blank" rel="noopener">Open app</a></p>
              </article>
              <article class="post-card">
                <h2 class="post-title"><a href="repobundle/">RepoBundle</a></h2>
                <p class="post-dek">A zipped repository becomes one verbatim, AI-ready context file without leaving the browser. React, TypeScript, Vite, Tailwind CSS, JSZip. Live.</p>
                <p class="card-links"><a href="https://legendalive.github.io/RepoBundle/" target="_blank" rel="noopener">Open app</a> <a href="https://github.com/legendalive/RepoBundle" target="_blank" rel="noopener">Source</a></p>
              </article>

  <script type="module">
    import { el } from '../assets/js/dom.js';
    import { refreshShell } from '../assets/js/shell.js';
    import { renderChrome, buildFooter, applyMeta, LABELS } from '../assets/js/chrome.js';
    import { loadManifest, getProjects } from '../assets/js/manifest.js';
    import { createListing } from '../assets/js/listing.js';

    renderChrome({ current: 'work' });

    applyMeta({
      title: 'Work — LegendAlive Studio',
      description: 'Products designed, built and operated by LegendAlive Studio. Each entry links to a case study and the live product.',
      path: 'work/',
      type: 'website',
    });

    function upgradeFooter(projects) {
      const foot = document.querySelector('.site-footer');
      if (!foot) return;
      foot.replaceWith(buildFooter(projects));
      refreshShell();
    }

    function optionsFor(key, labels, order) {
      return (items) => order
        .filter((value) => items.some((item) => item[key] === value))
        .map((value) => ({
          value,
          label: labels[value] || value,
          count: items.filter((item) => item[key] === value).length,
        }));
    }

    function projectCard(p) {
      const caseHref = String(p.page || ('work/' + p.slug + '/')).replace(/^work\//, '');
      const links = [el('a', { href: caseHref }, ['Case study'])];
      if (p.links && p.links.app) {
        links.push(el('a', { href: p.links.app, target: '_blank', rel: 'noopener' }, ['Open app']));
      }
      if (p.links && p.links.source) {
        links.push(el('a', { href: p.links.source, target: '_blank', rel: 'noopener' }, ['Source']));
      }
      const meta = [
        p.year,
        LABELS.category[p.category] || p.category,
        LABELS.status[p.status] || p.status,
      ].filter(Boolean).join(' · ');

      return el('article', { class: 'card' }, [
        el('div', { class: 'card-body' }, [
          el('div', { class: 'card-head' }, [
            el('h2', { class: 'card-title' }, [p.name]),
            el('span', { class: 'card-meta' }, [meta]),
          ]),
          el('p', { class: 'card-tagline' }, [p.tagline || '']),
          el('p', { class: 'card-stack' }, [(p.stack || []).join(' · ')]),
          el('div', { class: 'card-links' }, links),
        ]),
      ]);
    }

    const mount = document.getElementById('work-listing');
    if (mount) {
      createListing({
        mount,
        load: async () => {
          const data = await loadManifest();
          upgradeFooter(data.projects);
          return getProjects(data);
        },
        defaults: { q: '', sort: 'featured', status: '', category: '' },
        filters: [
          {
            key: 'status',
            label: 'Status',
            options: optionsFor('status', LABELS.status, ['live', 'building', 'lab', 'paused']),
          },
          {
            key: 'category',
            label: 'Category',
            options: optionsFor('category', LABELS.category, ['product', 'tool', 'experiment', 'client']),
          },
        ],
        sorts: [
          { value: 'featured', label: 'Featured' },
          { value: 'newest', label: 'Newest' },
          { value: 'az', label: 'A to Z' },
        ],
        query: (items, s) => getProjects({ projects: items }, {
          status: s.status, category: s.category, query: s.q, sort: s.sort,
        }),
        renderItem: projectCard,
        count: (shown) => shown.length + (shown.length === 1 ? ' project' : ' projects') +
          ' · ' + shown.filter((p) => p.status === 'live').length + ' live',
        resultsClass: 'grid-cards',
        searchLabel: 'Search work',
        searchPlaceholder: 'Search name, tagline or stack',
        emptyMessage: 'No projects match these filters.',
      });
    }
  </script>
</body>
