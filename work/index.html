  <script type="module">
    import { el, clear, LABELS, loadManifest, getProjects } from '../assets/js/app.js';

    const mount = document.getElementById('work-listing');

    function loading() {
      return el('div', { class: 'skeleton', 'aria-label': 'Loading projects' }, [
        el('div', { class: 'skeleton-line skeleton-line--title' }),
        el('div', { class: 'skeleton-line' }),
        el('div', { class: 'skeleton-line skeleton-line--short' }),
      ]);
    }

    function projectCard(p) {
      const caseHref = String(p.page || ('work/' + p.slug + '/')).replace(/^work\//, '');
      const links = [el('a', { href: caseHref }, ['Case study'])];
      if (p.links && p.links.app) {
        links.push(el('a', { href: p.links.app, target: '_blank', rel: 'noopener' }, ['Open app']));
      }
      if (p.links && p.links.source) {
        links.push(el('a', { href: p.links.source, target: '_blank', rel: 'noopener' }, ['Source']));
      }
      const meta = [
        p.year,
        LABELS.category[p.category] || p.category,
        LABELS.status[p.status] || p.status,
      ].filter(Boolean).join(' · ');

      return el('article', { class: 'card' }, [
        el('div', { class: 'card-body' }, [
          el('div', { class: 'card-head' }, [
            el('h2', { class: 'card-title' }, [p.name]),
            el('span', { class: 'card-meta' }, [meta]),
          ]),
          el('p', { class: 'card-tagline' }, [p.tagline || '']),
          (p.stack || []).length
            ? el('p', { class: 'card-stack' }, [p.stack.join(' · ')])
            : null,
          el('div', { class: 'card-links' }, links),
        ]),
      ]);
    }

    async function init() {
      if (!mount) return;
      clear(mount);
      mount.appendChild(loading());

      let data;
      try {
        data = await loadManifest();
      } catch (err) {
        clear(mount);
        mount.appendChild(el('div', { class: 'empty' }, [
          el('p', {}, [err && err.message ? err.message : 'The content manifest could not be loaded. Check your connection, then retry.']),
          el('button', { class: 'btn btn--primary', type: 'button', onClick: init }, ['Retry']),
        ]));
        return;
      }

      const projects = getProjects(data);
      clear(mount);
      if (!projects.length) {
        mount.appendChild(el('div', { class: 'empty' }, [
          el('p', {}, ['No projects are listed in the manifest yet.']),
        ]));
        return;
      }
      const grid = el('div', { class: 'grid-cards' });
      projects.forEach((p) => grid.appendChild(projectCard(p)));
      mount.appendChild(grid);
    }

    init();
  </script>
