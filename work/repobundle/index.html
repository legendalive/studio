        <div class="prose" style="margin-top:24px">
          <p>RepoBundle turns a zipped repository into a single file an AI model can read, without altering a line of source. The archive is extracted in the browser, every file is catalogued, a directory tree is generated, and the output is bundled verbatim by extension. Nothing is uploaded.</p>
