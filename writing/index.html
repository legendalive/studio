  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div data-chrome-nav>
    <noscript>
      <header class="site-nav">
        <div class="container nav-bar">
          <a class="nav-brand" href="../" aria-label="LegendAlive Studio, home">
            <span class="studio-mark studio-mark--sm" aria-hidden="true"></span>
            <span>LegendAlive Studio</span>
          </a>
          <nav class="nav-links" aria-label="Primary">
            <a href="../work/">Work</a>
            <a href="./" aria-current="true">Writing</a>
            <a href="../#capabilities">Capabilities</a>
            <a href="../about/">The developer</a>
            <a href="../#contact">Contact</a>
            <a href="https://github.com/legendalive" target="_blank" rel="noopener">GitHub</a>
          </nav>
        </div>
      </header>
    </noscript>
  </div>

  <main id="main">
    <section class="page-head" aria-labelledby="writing-title">
      <div class="container">
        <h1 id="writing-title">Writing</h1>
        <p class="lede">
          Notes from the build: architecture decisions, performance work, and
          the bugs that taught something. Every piece is drawn from a product
          that shipped.
        </p>
      </div>
    </section>

    <section class="section section--tight" aria-label="Article index">
      <div class="container">
        <div id="writing-listing">
          <noscript>
            <div class="empty">
              <p>
                The article index is filtered and searched in the browser, so
                it needs JavaScript. The engineering is also written up in the
                case studies, which read fully without it.
              </p>
              <a class="btn btn--primary" href="../work/">See the work</a>
            </div>
          </noscript>
        </div>
      </div>
    </section>
  </main>

  <div data-chrome-footer>
    <noscript>
      <footer class="site-footer">
        <div class="container">
          <div class="footer-bottom">
            <span>© 2026 Benson Mtsotso</span>
            <span>
              <a href="../">Home</a> · <a href="../work/">Work</a> ·
              <a href="../about/">The developer</a> ·
              <a href="mailto:mbenson.mb62@gmail.com">Email</a>
            </span>
          </div>
        </div>
      </footer>
    </noscript>
  </div>

  <script type="module">
    import { url } from '../assets/js/config.js';
    import { el, clear } from '../assets/js/dom.js';
    import { refreshShell } from '../assets/js/shell.js';
    import { renderChrome, buildFooter, applyMeta, LABELS } from '../assets/js/chrome.js';
    import { loadManifest, getPosts, allTags, formatDate } from '../assets/js/manifest.js';
    import { createListing } from '../assets/js/listing.js';

    renderChrome({ current: 'writing' });

    applyMeta({
      title: 'Writing — LegendAlive Studio',
      description: 'Notes from the build: architecture decisions, performance work and the bugs that taught something. Engineering writing from LegendAlive Studio.',
      path: 'writing/',
      type: 'website',
    });

    function upgradeFooter(projects) {
      const foot = document.querySelector('.site-footer');
      if (!foot) return;
      foot.replaceWith(buildFooter(projects));
      refreshShell();
    }

    function postCard(p) {
      return el('article', { class: 'post-card' }, [
        el('div', { class: 'post-meta' }, [
          el('span', { class: 'chip-kind' }, [p.kind || 'note']),
          el('span', {}, [formatDate(p.date)]),
          el('span', {}, [(p.minutes || 1) + ' min read']),
        ]),
        el('h2', { class: 'post-title' }, [
          el('a', { href: url('p/' + p.slug + '/') }, [p.title]),
        ]),
        el('p', { class: 'post-dek' }, [p.dek || '']),
        el('div', { class: 'post-tags' },
          (p.tags || []).map((t) => el('span', { class: 'tag' }, [t]))),
      ]);
    }

    function emptySurface(mount) {
      clear(mount);
      mount.appendChild(el('div', { class: 'empty' }, [
        el('p', {}, [
          'Nothing published yet. The first essays are drafted from the Weaver build and are being reviewed before they go live. The engineering is already written up in the case studies.',
        ]),
        el('div', { class: 'btn-row' }, [
          el('a', { class: 'btn btn--primary', href: url('work/') }, ['See the work']),
          el('a', { class: 'btn btn--ghost', href: url('about/') }, ['The developer']),
        ]),
      ]));
    }

    const mount = document.getElementById('writing-listing');

    async function init() {
      if (!mount) return;
      let data;
      try {
        data = await loadManifest();
      } catch (err) {
        clear(mount);
        mount.appendChild(el('div', { class: 'empty' }, [
          el('p', {}, [err && err.message ? err.message : 'The content manifest could not be loaded. Check your connection, then retry.']),
          el('button', { class: 'btn btn--primary', type: 'button', onClick: init }, ['Retry']),
        ]));
        return;
      }

      upgradeFooter(data.projects);
      const posts = getPosts(data);

      if (!posts.length) {
        emptySurface(mount);
        return;
      }

      clear(mount);
      createListing({
        mount,
        load: posts,
        defaults: { q: '', sort: 'newest', kind: '', tags: [] },
        filters: [
          {
            key: 'kind',
            label: 'Kind',
            options: (items) => Object.keys(LABELS.kind)
              .filter((k) => items.some((p) => p.kind === k))
              .map((k) => ({ value: k, label: LABELS.kind[k], count: items.filter((p) => p.kind === k).length })),
          },
          {
            key: 'tags',
            label: 'Tags',
            multi: true,
            options: (items) => allTags(items).map((t) => ({ value: t.tag, label: t.tag, count: t.count })),
          },
        ],
        sorts: [
          { value: 'newest', label: 'Newest' },
          { value: 'oldest', label: 'Oldest' },
          { value: 'az', label: 'A to Z' },
        ],
        query: (items, s) => getPosts({ posts: items }, {
          query: s.q, tags: s.tags, kind: s.kind, sort: s.sort,
        }),
        renderItem: postCard,
        count: (shown) => shown.length + (shown.length === 1 ? ' article' : ' articles'),
        resultsClass: 'list-flow',
        searchLabel: 'Search writing',
        searchPlaceholder: 'Search title, summary or tag',
        emptyMessage: 'No articles match these filters.',
      });
    }

    init();
  </script>
</body>
</html>
